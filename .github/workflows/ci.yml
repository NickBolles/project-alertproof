name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alertproof
          POSTGRES_PASSWORD: alertproof
          POSTGRES_DB: alertproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alertproof -d alertproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://alertproof:alertproof@localhost:5432/alertproof_test?schema=public
      TEST_DATABASE_URL: postgresql://alertproof:alertproof@localhost:5432/alertproof_test?schema=public
      SHOPIFY_API_KEY: dev-key
      SHOPIFY_API_SECRET: dev-secret
      SHOPIFY_APP_URL: http://localhost:3000
      SCOPES: read_orders,write_orders,read_products,read_inventory
      CRON_SECRET: alertproof-ci-cron-secret
      ALERTPROOF_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALERTPROOF_FORCE_MOCKS: "1"
      DISABLE_WORKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
