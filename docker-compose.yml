services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alertproof
      POSTGRES_PASSWORD: alertproof
      POSTGRES_DB: alertproof
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertproof -d alertproof"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - alertproof-postgres:/var/lib/postgresql/data

volumes:
  alertproof-postgres:
