app = "alertproof"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DISABLE_WORKER = "0"

[processes]
  app = "npm run start"

[deploy]
  release_command = "npm run db:deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"
    method = "GET"
    path = "/livez"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
