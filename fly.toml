# UNUSED. AlertProof is deployed to a Hostinger VPS behind Traefik via
# docker-compose.production.yml — see docs/GOING_LIVE.md. This file is kept only
# as a reference for a possible future Fly.io deployment and is not part of any
# release path. If it is ever revived, auto_stop_machines must stay "off": the
# app must be awake continuously or it drops Shopify webhooks.
app = "alertproof"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DISABLE_WORKER = "0"

[processes]
  app = "npm run start"

[deploy]
  release_command = "npm run db:deploy"

[http_service]
  internal_port = 3000
  force_https = true
  # Must stay "off": a stopped machine misses Shopify webhooks, and a missed
  # webhook is only recovered on the next reconciliation pass.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"
    method = "GET"
    path = "/livez"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
