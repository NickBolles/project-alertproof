client_id = "926e44e19dcebedd5e9978ab4c99e3c7"
name = "AlertProof"
application_url = "https://alertproof.nickbolles.com"
embedded = true

[build]
# Must stay false: `shopify app dev` would otherwise rewrite application_url to a
# temporary tunnel and break the registered production OAuth/webhook endpoints.
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app_subscriptions/update", "inventory_levels/update", "orders/create", "orders/paid", "order_transactions/create", "refunds/create"]
uri = "/webhooks/shopify"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/shopify"

[access_scopes]
scopes = "read_orders,write_orders,read_products,read_inventory"

[auth]
redirect_urls = ["https://alertproof.nickbolles.com/auth/callback"]
