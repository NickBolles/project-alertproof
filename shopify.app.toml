# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "926e44e19dcebedd5e9978ab4c99e3c7"
name = "AlertProof"
application_url = "https://alertproof.nickbolles.com"
embedded = true

[build]
# Must stay false: `shopify app dev` would otherwise rewrite application_url to a
# temporary tunnel and break the registered production OAuth/webhook endpoints.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  topics = [
  "app_subscriptions/update",
  "app/uninstalled",
  "inventory_levels/update",
  "order_transactions/create",
  "orders/create",
  "orders/paid",
  "refunds/create"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_orders,write_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://alertproof.nickbolles.com/auth/callback" ]
